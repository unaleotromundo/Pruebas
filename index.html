<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNKTIFY - Hardcore Music Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        
        body {
            font-family: 'Courier Prime', monospace;
        }
        
        .skew-text {
            transform: skewX(-6deg);
        }
        
        /* Estilo Winamp para el player */
        .winamp-player {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 2px solid #333;
            box-shadow: inset 0 1px 0 #444, 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .winamp-display {
            background: #0a3d0a;
            border: 2px inset #222;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        
        .winamp-button {
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border: 1px outset #666;
            box-shadow: 0 2px 0 #111;
        }
        
        .winamp-button:active {
            border-style: inset;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .equalizer-bar {
            background: linear-gradient(to top, #ff0000, #ffff00, #00ff00);
            animation: eq-bounce 0.5s ease-in-out infinite alternate;
        }
        
        @keyframes eq-bounce {
            0% { height: 20%; }
            100% { height: 80%; }
        }
        
        .volume-slider {
            -webkit-appearance: none;
            background: #222;
            border: 1px inset #111;
            height: 6px;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 20px;
            background: linear-gradient(180deg, #666 0%, #333 100%);
            border: 1px outset #888;
            cursor: pointer;
        }
        
        @keyframes scroll-text {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        .scrolling-text {
            animation: scroll-text 15s linear infinite;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen">
    
    <!-- Fondo graffiti -->
    <div class="fixed inset-0 opacity-10 pointer-events-none overflow-hidden">
        <div class="absolute top-10 left-10 text-9xl font-black text-purple-500 rotate-12">PUNK</div>
        <div class="absolute bottom-20 right-20 text-9xl font-black text-red-500 -rotate-12">ROCK</div>
        <div class="absolute top-1/2 left-1/4 text-7xl font-black text-yellow-400 rotate-45">★</div>
        <div class="absolute top-1/3 right-1/3 text-6xl font-black text-green-400 -rotate-12">SKATE</div>
    </div>

    <!-- Header -->
    <header class="relative z-10 border-b-4 border-red-600 bg-gradient-to-r from-purple-900 to-black p-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-5xl font-black mb-2 skew-text">
                <span class="text-red-500">PUNK</span><span class="text-purple-500">TIFY</span>
            </h1>
            <p class="text-yellow-400 text-lg uppercase tracking-wider">Powered by Deezer 🎸</p>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="relative z-10 bg-purple-900 border-b-2 border-yellow-400">
        <div class="max-w-6xl mx-auto px-6 py-4 flex gap-4">
            <button onclick="showView('search')" id="btn-search" class="px-6 py-2 font-bold uppercase skew-text bg-red-600 text-white">
                Search
            </button>
            <button onclick="showView('favorites')" id="btn-favorites" class="px-6 py-2 font-bold uppercase skew-text bg-black text-yellow-400 hover:bg-red-600 hover:text-white">
                Favorites (<span id="fav-count">0</span>)
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 max-w-6xl mx-auto p-6 pb-64">
        
        <!-- Search View -->
        <div id="search-view">
            <!-- Search Bar -->
            <div class="mb-8">
                <div class="relative">
                    <input 
                        type="text" 
                        id="search-input"
                        placeholder="BUSCAR EN DEEZER... (punk, nirvana, ramones)"
                        class="w-full bg-black border-4 border-purple-600 text-yellow-400 px-6 py-4 text-xl font-bold placeholder-purple-400 focus:border-red-600 focus:outline-none skew-text"
                        onkeypress="if(event.key === 'Enter') searchDeezer()"
                    />
                    <button 
                        onclick="searchDeezer()"
                        class="absolute right-2 top-1/2 -translate-y-1/2 bg-red-600 hover:bg-red-700 p-3 transform skew-x-3 transition-colors"
                    >
                        🔍
                    </button>
                </div>
                <button 
                    onclick="loadPopularPunk()"
                    class="mt-3 bg-purple-700 hover:bg-purple-600 px-4 py-2 font-bold text-sm uppercase"
                >
                    Cargar Punk Popular
                </button>
            </div>

            <div id="loading" class="hidden text-center py-10">
                <div class="text-6xl mb-4 animate-spin">💿</div>
                <p class="text-yellow-400 text-xl font-bold">CARGANDO MÚSICA...</p>
            </div>

            <!-- Results Grid -->
            <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- Favorites View -->
        <div id="favorites-view" class="hidden">
            <div id="favorites-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </main>

    <!-- Winamp-style Player -->
    <footer id="player" class="hidden fixed bottom-0 left-0 right-0 z-50">
        <div class="max-w-6xl mx-auto p-4">
            <div class="winamp-player rounded-t-lg p-4">
                
                <!-- Display Screen -->
                <div class="winamp-display rounded p-3 mb-3">
                    <div class="overflow-hidden h-6 mb-2">
                        <div id="track-info" class="scrolling-text text-sm">
                            ♫ PUNKTIFY - No Track Playing ♫
                        </div>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                    <div class="w-full bg-black h-1 mt-1 rounded">
                        <div id="progress-bar" class="bg-green-500 h-full rounded transition-all" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Album Art & Equalizer -->
                <div class="flex gap-4 mb-3">
                    <img id="player-img" src="" alt="" class="w-24 h-24 border-2 border-yellow-400 rounded">
                    
                    <!-- Fake Equalizer -->
                    <div class="flex-1 flex items-end gap-1 h-24 bg-black rounded p-2">
                        <div class="equalizer-bar bg-gradient-to-t from-red-500 to-green-400 w-3 rounded" style="animation-delay: 0s"></div>
                        <div class="equalizer-bar bg-gradient-to-t from-red-500 to-green-400 w-3 rounded" style="animation-delay: 0.1s"></div>
                        <div class="equalizer-bar bg-gradient-to-t from-red-500 to-green-400 w-3 rounded" style="animation-delay: 0.2s"></div>
                        <div class="equalizer-bar bg-gradient-to-t from-red-500 to-green-400 w-3 rounded" style="animation-delay: 0.3s"></div>
                        <div class="equalizer-bar bg-gradient-to-t from-red-500 to-green-400 w-3 rounded" style="animation-delay: 0.4s"></div>
                        <div class="equalizer-bar bg-gradient-to-t from-red-500 to-green-400 w-3 rounded" style="animation-delay: 0.5s"></div>
                        <div class="equalizer-bar bg-gradient-to-t from-red-500 to-green-400 w-3 rounded" style="animation-delay: 0.6s"></div>
                        <div class="equalizer-bar bg-gradient-to-t from-red-500 to-green-400 w-3 rounded" style="animation-delay: 0.7s"></div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="flex items-center justify-center gap-2 mb-3">
                    <button onclick="previousTrack()" class="winamp-button p-3 rounded hover:bg-gray-700" title="Previous">⏮️</button>
                    <button onclick="togglePlay()" id="play-btn" class="winamp-button p-4 rounded hover:bg-gray-700 text-2xl" title="Play/Pause">▶️</button>
                    <button onclick="stopTrack()" class="winamp-button p-3 rounded hover:bg-gray-700" title="Stop">⏹️</button>
                    <button onclick="nextTrack()" class="winamp-button p-3 rounded hover:bg-gray-700" title="Next">⏭️</button>
                    
                    <div class="flex-1 flex items-center gap-2 ml-4">
                        <span class="text-xs">🔊</span>
                        <input type="range" id="volume-slider" class="volume-slider flex-1" min="0" max="100" value="70" onchange="setVolume(this.value)">
                        <span id="volume-display" class="text-xs w-10">70%</span>
                    </div>
                    
                    <button onclick="closePlayer()" class="winamp-button p-3 rounded hover:bg-gray-700 ml-2" title="Close">❌</button>
                </div>
            </div>
        </div>
    </footer>

    <!-- Hidden Audio Player -->
    <audio id="audio-player"></audio>

    <script>
        let favorites = [];
        let currentTrack = null;
        let currentPlaylist = [];
        let currentIndex = 0;
        const audio = document.getElementById('audio-player');

        // Deezer CORS Proxy
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        async function searchDeezer() {
            const term = document.getElementById('search-input').value.trim();
            if (!term) return;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results-grid').innerHTML = '';

            try {
                const response = await fetch(`${CORS_PROXY}https://api.deezer.com/search?q=${encodeURIComponent(term)}&limit=30`);
                const data = await response.json();
                
                currentPlaylist = data.data.map(track => ({
                    id: track.id,
                    name: track.title,
                    artist: track.artist.name,
                    album: track.album.title,
                    image: track.album.cover_medium,
                    preview: track.preview,
                    duration: track.duration
                }));

                renderResults(currentPlaylist);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('results-grid').innerHTML = `
                    <div class="col-span-full text-center py-10 text-red-500">
                        <p class="text-xl font-bold">ERROR AL BUSCAR</p>
                        <p class="text-sm mt-2">Intenta de nuevo o prueba con otra búsqueda</p>
                    </div>
                `;
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function loadPopularPunk() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results-grid').innerHTML = '';
            document.getElementById('search-input').value = 'punk rock';

            try {
                const response = await fetch(`${CORS_PROXY}https://api.deezer.com/search?q=punk rock&limit=30`);
                const data = await response.json();
                
                currentPlaylist = data.data.map(track => ({
                    id: track.id,
                    name: track.title,
                    artist: track.artist.name,
                    album: track.album.title,
                    image: track.album.cover_medium,
                    preview: track.preview,
                    duration: track.duration
                }));

                renderResults(currentPlaylist);
            } catch (error) {
                console.error('Error:', error);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function renderResults(tracks) {
            const grid = document.getElementById('results-grid');
            grid.innerHTML = tracks.map(track => {
                const isFav = favorites.some(f => f.id === track.id);
                return `
                    <div class="bg-gradient-to-br from-purple-900 to-black border-2 border-yellow-400 p-4 hover:border-red-600 transition-all transform hover:scale-105 hover:-rotate-1">
                        <img src="${track.image}" alt="${track.name}" class="w-full aspect-square object-cover mb-3 border-2 border-white">
                        <h3 class="font-bold text-yellow-400 mb-1 truncate" title="${track.name}">${track.name}</h3>
                        <p class="text-purple-300 text-sm mb-1 truncate" title="${track.artist}">${track.artist}</p>
                        <p class="text-gray-400 text-xs mb-3">${formatTime(track.duration)}</p>
                        <div class="flex gap-2">
                            <button onclick='playTrack(${JSON.stringify(track).replace(/'/g, "&apos;")})' class="flex-1 bg-red-600 hover:bg-red-700 py-2 px-4 font-bold flex items-center justify-center gap-2 skew-text transition-colors">
                                ▶️ PLAY
                            </button>
                            <button onclick='toggleFavorite(${JSON.stringify(track).replace(/'/g, "&apos;")})' class="p-2 border-2 transition-all ${isFav ? 'bg-red-600 border-red-600' : 'bg-black border-yellow-400 hover:border-red-600'}">
                                ${isFav ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function playTrack(track) {
            currentTrack = track;
            currentIndex = currentPlaylist.findIndex(t => t.id === track.id);
            
            document.getElementById('player').classList.remove('hidden');
            document.getElementById('player-img').src = track.image;
            document.getElementById('track-info').innerHTML = `♫ ${track.name} - ${track.artist} ♫ ♫ Album: ${track.album} ♫`;
            document.getElementById('total-time').textContent = formatTime(track.duration);
            
            audio.src = track.preview;
            audio.volume = document.getElementById('volume-slider').value / 100;
            audio.play();
            document.getElementById('play-btn').textContent = '⏸️';
        }

        function togglePlay() {
            if (!currentTrack) return;
            
            if (audio.paused) {
                audio.play();
                document.getElementById('play-btn').textContent = '⏸️';
            } else {
                audio.pause();
                document.getElementById('play-btn').textContent = '▶️';
            }
        }

        function stopTrack() {
            audio.pause();
            audio.currentTime = 0;
            document.getElementById('play-btn').textContent = '▶️';
        }

        function nextTrack() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            playTrack(currentPlaylist[currentIndex]);
        }

        function previousTrack() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playTrack(currentPlaylist[currentIndex]);
        }

        function setVolume(value) {
            audio.volume = value / 100;
            document.getElementById('volume-display').textContent = value + '%';
        }

        function closePlayer() {
            document.getElementById('player').classList.add('hidden');
            audio.pause();
            currentTrack = null;
        }

        function toggleFavorite(track) {
            const index = favorites.findIndex(f => f.id === track.id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(track);
            }
            document.getElementById('fav-count').textContent = favorites.length;
            
            if (document.getElementById('search-view').style.display !== 'none') {
                renderResults(currentPlaylist);
            } else {
                showFavorites();
            }
        }

        function showView(view) {
            document.getElementById('btn-search').className = 'px-6 py-2 font-bold uppercase skew-text ' + 
                (view === 'search' ? 'bg-red-600 text-white' : 'bg-black text-yellow-400 hover:bg-red-600 hover:text-white');
            document.getElementById('btn-favorites').className = 'px-6 py-2 font-bold uppercase skew-text ' + 
                (view === 'favorites' ? 'bg-red-600 text-white' : 'bg-black text-yellow-400 hover:bg-red-600 hover:text-white');
            
            if (view === 'search') {
                document.getElementById('search-view').style.display = 'block';
                document.getElementById('favorites-view').style.display = 'none';
            } else {
                document.getElementById('search-view').style.display = 'none';
                document.getElementById('favorites-view').style.display = 'block';
                showFavorites();
            }
        }

        function showFavorites() {
            currentPlaylist = favorites;
            const grid = document.getElementById('favorites-grid');
            if (favorites.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <div class="text-8xl mb-4">🤍</div>
                        <p class="text-2xl font-bold text-purple-400">NO FAVORITES YET!</p>
                        <p class="text-yellow-400 mt-2">Start adding some tracks ♥</p>
                    </div>
                `;
            } else {
                renderResults(favorites);
            }
        }

        // Update progress bar
        audio.addEventListener('timeupdate', () => {
            if (!currentTrack) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('current-time').textContent = formatTime(Math.floor(audio.currentTime));
        });

        // Auto next track
        audio.addEventListener('ended', () => {
            nextTrack();
        });

        // Inicializar
        loadPopularPunk();
    </script>
</body>
</html>
