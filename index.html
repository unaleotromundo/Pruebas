<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webamp Full - Canciones Completas</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <style>
        body { background-color: #008080; margin: 20px; font-family: sans-serif; }
        #app { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .winamp-font { background: #000; color: #00ff00; padding: 5px; font-family: monospace; }
        .album-art { width: 100%; height: 180px; object-fit: cover; border: 2px inset #fff; background: #000; }
        .lyrics-container { 
            height: 250px; background: #000; color: #0f0; overflow-y: auto; 
            padding: 15px; text-align: center; border: 2px inset #808080; font-size: 16px; 
        }
        .lyric-line { opacity: 0.3; transition: all 0.2s; margin: 8px 0; }
        .lyric-line.active { opacity: 1; color: #fff; text-shadow: 0 0 5px #0f0; transform: scale(1.1); }
        .search-results { height: 350px; overflow-y: scroll; background: white; border: 2px inset #808080; }
        .track-item { cursor: pointer; padding: 5px; border-bottom: 1px solid #eee; font-size: 12px; }
        .track-item:hover { background: #000080; color: white; }
        
        /* Ocultar el reproductor de YouTube pero mantenerlo funcional */
        #youtube-player-container {
            width: 1px; height: 1px; position: absolute; left: -9999px;
        }
        .controls-panel { background: #c0c0c0; padding: 10px; border: 1px inset #fff; margin: 10px 0; }
        .progress-bar { width: 100%; height: 15px; background: #000; position: relative; cursor: pointer; }
        .progress-fill { height: 100%; background: #000080; width: 0%; }
    </style>
</head>
<body>

<div id="app">
    <!-- PANEL DE BUSQUEDA -->
    <div class="window" style="width: 300px">
        <div class="title-bar"><div class="title-bar-text">Buscador_Musica.exe</div></div>
        <div class="window-body">
            <div class="field-row">
                <input v-model="query" @keyup.enter="searchMusic" type="text" style="width: 100%" placeholder="Artista o canción...">
            </div>
            <button @click="searchMusic" style="width: 100%; margin: 8px 0;" :disabled="loading">
                {{ loading ? 'BUSCANDO...' : 'BUSCAR CANCIÓN' }}
            </button>
            <div class="search-results">
                <div v-for="track in results" :key="track.id" class="track-item" @click="playTrack(track)">
                    <strong>{{ track.artist.name }}</strong> - {{ track.title }}
                </div>
            </div>
        </div>
    </div>

    <!-- REPRODUCTOR PRINCIPAL -->
    <div class="window" style="width: 450px">
        <div class="title-bar"><div class="title-bar-text">Webamp Player v3.0 - Full Audio</div></div>
        <div class="window-body">
            <div class="winamp-font" style="margin-bottom: 10px; height: 24px; overflow: hidden;">
                {{ currentTrack ? currentTrack.title + ' - ' + currentTrack.artist.name : 'STOPPED' }}
            </div>
            
            <div style="display: flex; gap: 10px;">
                <div style="width: 150px">
                    <img v-if="currentTrack" :src="currentTrack.album.cover_medium" class="album-art">
                    <div v-else class="album-art"></div>
                </div>
                <div style="flex: 1">
                    <div class="controls-panel">
                        <div style="margin-bottom: 5px; font-size: 10px;">PROGRESO: {{ formatTime(currentTime) }} / {{ formatTime(duration) }}</div>
                        <div class="progress-bar" @click="seek">
                            <div class="progress-fill" :style="{ width: (currentTime/duration * 100) + '%' }"></div>
                        </div>
                        <div style="margin-top: 10px; display: flex; gap: 5px;">
                            <button @click="togglePlay" style="flex: 1">{{ isPlaying ? 'PAUSE' : 'PLAY' }}</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lyrics-container" ref="lyricsScroll">
                <div v-for="(line, index) in lyrics" :key="index" :class="['lyric-line', { active: currentLineIndex === index }]">
                    {{ line.text }}
                </div>
                <div v-if="currentTrack && lyrics.length === 0" style="padding-top: 80px">Buscando letra sincronizada...</div>
            </div>
        </div>
    </div>

    <!-- Elemento oculto para YouTube -->
    <div id="youtube-player-container"><div id="player"></div></div>
</div>

<!-- Scripts necesarios -->
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                query: '',
                results: [],
                currentTrack: null,
                lyrics: [],
                currentLineIndex: -1,
                loading: false,
                isPlaying: false,
                currentTime: 0,
                duration: 0,
                ytPlayer: null
            }
        },
        mounted() {
            // Inicializar YouTube Player cuando la API esté lista
            window.onYouTubeIframeAPIReady = () => {
                this.ytPlayer = new YT.Player('player', {
                    height: '0', width: '0',
                    events: {
                        'onStateChange': this.onPlayerStateChange,
                        'onReady': () => { setInterval(this.updateProgress, 500); }
                    }
                });
            };
        },
        methods: {
            async searchMusic() {
                if (!this.query) return;
                this.loading = true;
                const proxy = "https://corsproxy.io/?";
                const target = `https://api.deezer.com/search?q=${encodeURIComponent(this.query)}`;
                try {
                    const res = await fetch(proxy + encodeURIComponent(target));
                    const data = await res.json();
                    this.results = data.data || [];
                } catch (e) { alert("Error de conexión"); }
                this.loading = false;
            },

            async playTrack(track) {
                this.currentTrack = track;
                this.lyrics = [];
                this.currentLineIndex = -1;
                
                // 1. Buscar el video en YouTube usando un motor de búsqueda público
                const searchStr = `${track.artist.name} ${track.title} audio`;
                try {
                    // Usamos una instancia pública de Piped (YouTube alternativo) para buscar el ID del video
                    const ytSearchRes = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(searchStr)}&filter=music_videos`);
                    const ytData = await ytSearchRes.json();
                    const videoId = ytData.items[0].url.split("v=")[1];
                    
                    this.ytPlayer.loadVideoById(videoId);
                    this.isPlaying = true;
                } catch (e) {
                    alert("No se pudo obtener el audio de YouTube.");
                }

                // 2. Obtener letras
                try {
                    const lrcRes = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(track.artist.name)}&track_name=${encodeURIComponent(track.title)}`);
                    const lrcData = await lrcRes.json();
                    if (lrcData.syncedLyrics) this.parseLRC(lrcData.syncedLyrics);
                    else this.lyrics = [{time: 0, text: lrcData.plainLyrics || "Letra no disponible"}];
                } catch (e) { this.lyrics = [{time: 0, text: "Error cargando letras"}]; }
            },

            parseLRC(lrcText) {
                const lines = lrcText.split('\n');
                const result = [];
                const timeReg = /\[(\d+):(\d+\.\d+)\]/;
                lines.forEach(line => {
                    const match = timeReg.exec(line);
                    if (match) {
                        result.push({ time: parseFloat(match[1]) * 60 + parseFloat(match[2]), text: line.replace(timeReg, '').trim() });
                    }
                });
                this.lyrics = result;
            },

            updateProgress() {
                if (this.ytPlayer && this.isPlaying) {
                    this.currentTime = this.ytPlayer.getCurrentTime();
                    this.duration = this.ytPlayer.getDuration();
                    this.syncLyrics();
                }
            },

            syncLyrics() {
                const index = this.lyrics.findIndex((line, i) => {
                    return this.currentTime >= line.time && (!this.lyrics[i+1] || this.currentTime < this.lyrics[i+1].time);
                });
                if (index !== -1 && index !== this.currentLineIndex) {
                    this.currentLineIndex = index;
                    const container = this.$refs.lyricsScroll;
                    const activeLine = container.querySelectorAll('.lyric-line')[index];
                    if (activeLine) container.scrollTop = activeLine.offsetTop - container.offsetTop - 100;
                }
            },

            togglePlay() {
                if (this.isPlaying) this.ytPlayer.pauseVideo();
                else this.ytPlayer.playVideo();
                this.isPlaying = !this.isPlaying;
            },

            seek(e) {
                const percent = e.offsetX / e.target.offsetWidth;
                this.ytPlayer.seekTo(this.duration * percent);
            },

            formatTime(s) {
                if (!s) return "0:00";
                const mins = Math.floor(s / 60);
                const secs = Math.floor(s % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            },

            onPlayerStateChange(event) {
                if (event.data == YT.PlayerState.PLAYING) this.isPlaying = true;
                else if (event.data == YT.PlayerState.PAUSED) this.isPlaying = false;
            }
        }
    }).mount('#app');
</script>

</body>
</html>
